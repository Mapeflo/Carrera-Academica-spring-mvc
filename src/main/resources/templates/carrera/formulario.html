<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario Carrera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h1 th:text="${titulo}">Formulario Carrera Académica</h1>

<form th:action="@{/carreras/guardar}" th:object="${carrera}" method="post">

    <!-- Campo oculto para el ID (importante en edición) -->
    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Número de Créditos</label>
        <input type="number" class="form-control" th:field="*{numCreditos}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Número de Asignaturas</label>
        <input type="number" class="form-control" th:field="*{numAsignaturas}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Número de Semestres</label>
        <input type="number" class="form-control" th:field="*{numSemestres}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Nivel de Formación</label>
        <input type="text" class="form-control" th:field="*{nivelFormacion}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" class="form-control" th:field="*{titulo}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Valor del Semestre</label>
        <input type="number" step="0.01" class="form-control" th:field="*{valorSemestre}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Universidad</label>
        <input type="text" class="form-control" th:field="*{universidad}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">¿Está Acreditada?</label>
        <select class="form-select" th:field="*{esAcreditada}">
            <option th:value="true">Sí</option>
            <option th:value="false">No</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Perfiles</label>
        <textarea class="form-control" th:field="*{perfiles}" rows="3"></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Área de Conocimiento</label>
        <input type="text" class="form-control" th:field="*{areaConocimiento}" required>
    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
    <a th:href="@{/carreras}" class="btn btn-secondary">Cancelar</a>
</form>

</body>
</html>
