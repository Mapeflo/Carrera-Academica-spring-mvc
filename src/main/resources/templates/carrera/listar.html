<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Carreras Académicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h1 class="mb-4">Listado de Carreras Académicas</h1>

<a th:href="@{/carreras/nueva}" class="btn btn-primary mb-3">Nueva Carrera</a>

<table class="table table-bordered table-striped table-hover">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Créditos</th>
        <th>Semestres</th>
        <th>Universidad</th>
        <th>Acreditada</th>
        <th>Área</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="carrera : ${carreras}">
        <td th:text="${carrera.id}"></td>
        <td th:text="${carrera.nombre}"></td>
        <td th:text="${carrera.numCreditos}"></td>
        <td th:text="${carrera.numSemestres}"></td>
        <td th:text="${carrera.universidad}"></td>
        <td th:text="${carrera.esAcreditada ? 'Sí' : 'No'}"></td>
        <td th:text="${carrera.areaConocimiento}"></td>
        <td>
            <a th:href="@{/carreras/editar/{id}(id=${carrera.id})}" class="btn btn-warning btn-sm">Editar</a>
            <a th:href="@{/carreras/eliminar/{id}(id=${carrera.id})}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('¿Estás seguro de eliminar esta carrera?')">Eliminar</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
