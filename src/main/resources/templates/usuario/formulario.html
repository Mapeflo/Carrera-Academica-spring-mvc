<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h1 th:text="${titulo}">Formulario Usuario</h1>

<form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">

    <!-- ID oculto (necesario para editar) -->
    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
        <label class="form-label">Nombre de Usuario</label>
        <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Clave</label>
        <input type="text" class="form-control" th:field="*{clave}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Rol</label>
        <select class="form-select" th:field="*{rol}" required>
            <option value="">Seleccione un rol</option>
            <option value="ADMIN">ADMIN</option>
            <option value="USER">USER</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
    <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
</form>

</body>
</html>
