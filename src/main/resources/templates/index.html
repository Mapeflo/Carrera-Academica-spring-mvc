<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Inicio - Carrera Académica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Sistema de Carreras Académicas</h1>
    <div>
        <span sec:authentication="name" class="me-3"></span>
        <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
    </div>
</div>

<div class="row">
    <div class="col-md-6 mb-3">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Carreras Académicas</h5>
                <p class="card-text">Gestionar las carreras del sistema.</p>
                <a th:href="@{/carreras}" class="btn btn-primary">Ir a Carreras</a>
            </div>
        </div>
    </div>

    <div class="col-md-6 mb-3" sec:authorize="hasRole('ADMIN')">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Usuarios</h5>
                <p class="card-text">Gestionar usuarios del sistema (solo ADMIN).</p>
                <a th:href="@{/usuarios}" class="btn btn-primary">Ir a Usuarios</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
