<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Clave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4>Recuperar Clave</h4>
            </div>
            <div class="card-body">

                <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{/recuperar}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" name="email" class="form-control" required placeholder="Ingresa tu correo">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Enviar clave a mi correo</button>
                </form>

                <div class="mt-3 text-center">
                    <a th:href="@{/login}">Volver al Login</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
